name: Mental Health Prediction CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out project
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q backend

      # The suite starts and stops its own localhost server and checks frontend
      # serving, prediction, validation, missing values, reports, and metrics.
      # Use the committed model; full training is intentionally a separate task.
      - name: Run application integration tests
        run: python -m unittest backend.test_application -v

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build application image on GitHub
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag "mental-health:$GITHUB_SHA" .
          docker run --rm --entrypoint python "mental-health:$GITHUB_SHA" -c "from backend.app.rag_service import guide_search_answer; result=guide_search_answer('What is stress?'); assert result['sources'], 'Bundled RAG guide is missing from the image'"
          docker save "mental-health:$GITHUB_SHA" | gzip -1 > image.tar.gz

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_KEY" || { echo "Missing EC2_SSH_KEY secret"; exit 1; }
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo "EC2_HOST must be an IP or hostname without http://"; exit 1; }
          [[ "$EC2_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo "Missing or invalid EC2_USER"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null
          if [ -n "$EC2_KNOWN_HOSTS" ]; then
            printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
            host_check=yes
          else
            host_check=accept-new
          fi
          cat > ~/.ssh/config <<EOF
          Host mental-health-ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/ec2_key
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            StrictHostKeyChecking $host_check
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload built image and deploy
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=release.tar.gz HEAD
          scp release.tar.gz "mental-health-ec2:mental-health-${GITHUB_SHA}.tar.gz"
          scp image.tar.gz "mental-health-ec2:mental-health-image-${GITHUB_SHA}.tar.gz"
          ssh mental-health-ec2 "bash -s -- '$GITHUB_SHA'" < deploy/ec2-deploy.sh

      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: rm -f ~/.ssh/ec2_key ~/.ssh/config ~/.ssh/known_hosts
